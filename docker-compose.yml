services:
  dev:
    build:
      context: .
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
    # Ensure host.docker.internal resolves (needed on Linux; Docker Desktop adds it on Windows)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional per-machine overrides (e.g. VITE_DIRECTOR=<director-ip>:80). Missing file is fine.
    env_file:
      - path: .env.local
        required: false
    environment:
      - VITE_PORT=5173
      - DOCKER=true
      # Container reaches host via host.docker.internal. Run designer-proxy on host to forward to Designer.
      # Director resolution: ?director= URL param > VITE_DIRECTOR (.env.local) > localhost:80 default.
      - VITE_PROXY_TARGET=http://host.docker.internal:18080
    tty: true
    stdin_open: true

volumes:
  node_modules:

