services:
  dev:
    build:
      context: .
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
    # Ensure host.docker.internal resolves (needed on Linux; Docker Desktop adds it on Windows)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_PORT=5173
      - DOCKER=true
      # For local Designer: use localhost so proxy mode activates (proxy forwards to VITE_PROXY_TARGET)
      # For remote: use the director IP, e.g. VITE_DIRECTOR=<director-ip>:80
      - VITE_DIRECTOR=localhost:80
      # Container reaches host via host.docker.internal. Run designer-proxy on host to forward to Designer.
      - VITE_PROXY_TARGET=http://host.docker.internal:18080
    tty: true
    stdin_open: true

volumes:
  node_modules:

